; ============================================================
; Ventos Campinas - Firmware do anemometro
; Placa: ESP32-WROOM-32 DevKit (CP2102, 4 MB Flash)
; ============================================================
; Este arquivo e o "composer.json" do projeto: tudo que o build
; precisa esta declarado aqui. Qualquer maquina que clonar o
; repositorio gera exatamente o mesmo binario.

[env:esp32dev]

; --- Plataforma e framework -------------------------------
; Versao fixada de proposito: builds reproduziveis.
; O "^" aceita correcoes 6.x mas nunca sobe para 7.x sozinho.
platform  = espressif32@^6.9.0

; "esp32dev" e o perfil generico do ESP32-WROOM-32 com 4 MB.
board     = esp32dev

; Arduino como camada de API. Por baixo roda o ESP-IDF.
framework = arduino

; --- Gravacao ---------------------------------------------
; 460800 baud e rapido e confiavel no CP2102.
; Se a gravacao falhar por ruido/cabo, baixe para 115200.
upload_speed = 460800

; --- Monitor serial ---------------------------------------
; PRECISA ser igual ao Serial.begin() do main.cpp.
; Se nao bater, a tela mostra caracteres invalidos.
monitor_speed = 115200

monitor_filters =
    ; Converte backtrace de crash em arquivo:linha. Essencial.
    esp32_exception_decoder
    ; Prefixa cada linha com horario.
    time

; --- Compilacao -------------------------------------------
build_flags =
    ; Nivel de log do core ESP32 (3 = info). Suba para 4/5 ao
    ; depurar Wi-Fi na Fase 4.
    -D CORE_DEBUG_LEVEL=3

; test/test_medicao define seu proprio main(), que colide com o
; setup()/loop() que o framework Arduino espera ao linkar testes
; neste ambiente. A suite e nativa por design (env:native) -- aqui
; so ignoramos, sem tentar linkar.
test_ignore = *

; --- Testes sem hardware -----------------------------------
; Roda no Mac, nao no ESP32. So compila codigo que nao depende
; de Arduino.h/hardware real -- por isso medicao.{h,cpp} e
; deliberadamente livre dessa dependencia.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<medicao.cpp>

; --- Modo de calibracao -------------------------------------
; So para descobrir pulsos/volta quando o dupont chegar.
; make flash ENV=calibracao
[env:calibracao]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D MODO_CALIBRACAO
